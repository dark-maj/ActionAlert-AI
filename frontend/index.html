<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionAlert AI</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f4f4f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem 1rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .dashboard-card {
      max-width: 1000px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #18181b;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #52525b;
      margin-bottom: 0.4rem;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #6366f1;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      margin-bottom: 1rem;
    }

    input {
      margin-bottom: 1rem;
    }

    button {
      width: 100%;
      padding: 0.7rem;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #4f46e5;
    }

    button:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
    }

    #result {
      margin-top: 1.5rem;
      display: none;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-urgent {
      background: #fee2e2;
      color: #b91c1c;
    }

    .badge-not_urgent {
      background: #dcfce7;
      color: #15803d;
    }

    tr.row-urgent td {
      background: #fef2f2;
    }

    .muted {
      color: #a1a1aa;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }

    .field-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #71717a;
      width: 80px;
      flex-shrink: 0;
    }

    .field-value {
      font-size: 0.9rem;
      color: #18181b;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li::before {
      content: "→ ";
      color: #6366f1;
    }

    ul li {
      font-size: 0.9rem;
      color: #18181b;
      margin-bottom: 0.3rem;
    }

    .error {
      color: #b91c1c;
      font-size: 0.9rem;
      margin-top: 1rem;
      display: none;
    }

    /* Inbox dashboard */

    .dashboard-controls {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      margin-bottom: 1rem;
    }

    .dashboard-controls button {
      width: auto;
      flex: 1;
    }

    .filter-container {
      min-width: 180px;
    }

    .filter-container select {
      margin-top: 0.4rem;
    }

    .status {
      min-height: 24px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #71717a;
    }

    .status-error {
      color: #b91c1c;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th,
    td {
      padding: 0.75rem;
      border-bottom: 1px solid #e4e4e7;
      text-align: left;
    }

    th {
      background: #fafafa;
      color: #52525b;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    td {
      color: #18181b;
    }

    th:nth-child(2),
    td:nth-child(2),
    th:nth-child(5),
    td:nth-child(5) {
      white-space: normal;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      body {
        padding: 1rem;
      }

      .card {
        padding: 1.25rem;
      }

      .dashboard-controls {
        flex-direction: column;
        align-items: stretch;
      }

      .dashboard-controls button {
        width: 100%;
      }

      .filter-container {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>ActionAlert AI</h1>

    <label for="subject">Subject</label>
    <input id="subject" type="text" placeholder="e.g. Meeting tomorrow" />

    <label for="body">Email Body</label>
    <textarea id="body" placeholder="Paste your email here..."></textarea>

    <button id="btn" onclick="classify()">Classify</button>

    <p class="error" id="error"></p>

    <div id="result">

      <div class="row">
        <span class="field-label">Label</span>
        <span id="label-badge" class="badge"></span>
        <span id="confidence" style="font-size:0.8rem;color:#71717a;"></span>
      </div>

      <div class="row">
        <span class="field-label">Deadline</span>
        <span id="deadline" class="field-value"></span>
      </div>

      <div class="row" style="align-items:flex-start">
        <span class="field-label">Actions</span>
        <ul id="actions"></ul>
      </div>

    </div>
  </div>


  <div class="card dashboard-card">

    <h1>Inbox dashboard</h1>

    <div class="dashboard-controls">

      <button id="load-history-btn">
        Load history
      </button>

      <button id="fetch-emails-btn">
        Fetch new emails
      </button>

      <div class="filter-container">
        <label for="label-filter">Filter</label>

        <select id="label-filter">
          <option value="all">all</option>
          <option value="urgent">urgent</option>
          <option value="not_urgent">not_urgent</option>
        </select>
      </div>

    </div>

    <div
      id="inbox-status"
      class="status"
      aria-live="polite"
    ></div>

    <div class="table-container">

      <table id="inbox-table">

        <thead>
          <tr>
            <th>Label</th>
            <th>Subject</th>
            <th>From</th>
            <th>Deadline</th>
            <th>Actions</th>
            <th>Classified at</th>
          </tr>
        </thead>

        <tbody id="inbox-table-body">
        </tbody>

      </table>

    </div>

  </div>


  <script>

  function getPassword() {
    let password = localStorage.getItem("appPassword");

    if (password) {
      return password;
    }

    password = prompt("Owner password for inbox features");

    if (!password || password.trim() === "") {
      return null;
    }

    localStorage.setItem("appPassword", password);
    return password;
  }


  async function api_fetch(url, options = {}, password = null) {
    const headers = {
      ...options.headers
    };

    if (password) {
      headers["X-App-Password"] = password;
    }

    const response = await fetch(url, {
      ...options,
      headers
    });

    return response;
  }


  async function protectedFetch(url, options = {}) {
    const password = getPassword();

    if (!password) {
      setInboxStatus("Owner-only");
      return null;
    }

    const response = await api_fetch(url, options, password);

    if (response.status === 401) {
      localStorage.removeItem("appPassword");
      setInboxStatus(
        "Invalid password — click again to retry",
        true
      );
      return null;
    }

    return response;
  }


  function setInboxStatus(message, isError = false) {
    const status = document.getElementById("inbox-status");

    status.textContent = message;
    status.className = isError
      ? "status status-error"
      : "status";
  }


  // Rows currently shown in the table; the filter works on this list.
  let currentEmails = [];


  function makeCell(text) {
    const td = document.createElement("td");

    if (text) {
      td.textContent = text;
    } else {
      td.textContent = "—";
      td.className = "muted";
    }

    return td;
  }


  function formatDate(iso) {
    if (!iso) {
      return null;
    }

    const date = new Date(iso);
    return isNaN(date) ? iso : date.toLocaleString();
  }


  function renderTable(emails) {
    const tbody = document.getElementById("inbox-table-body");
    tbody.replaceChildren();

    if (emails.length === 0) {
      const tr = document.createElement("tr");
      const td = makeCell("No emails yet");
      td.colSpan = 6;
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    for (const email of emails) {
      const tr = document.createElement("tr");

      if (email.label === "urgent") {
        tr.className = "row-urgent";
      }

      // Label column reuses the classifier badge styles.
      const labelTd = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge badge-" + email.label;
      badge.textContent = email.label;
      labelTd.appendChild(badge);
      tr.appendChild(labelTd);

      // /history rows use "sender", /emails rows use "from".
      tr.appendChild(makeCell(email.subject));
      tr.appendChild(makeCell(email.sender || email.from));
      tr.appendChild(makeCell(email.deadline));
      tr.appendChild(makeCell((email.actions || []).join(", ")));
      tr.appendChild(makeCell(formatDate(email.classified_at)));

      tbody.appendChild(tr);
    }
  }


  function applyFilter() {
    const label = document.getElementById("label-filter").value;

    const visible = label === "all"
      ? currentEmails
      : currentEmails.filter(e => e.label === label);

    renderTable(visible);
    return visible.length;
  }


  async function readError(response) {
    try {
      const data = await response.json();
      return data.detail || "Server error.";
    } catch {
      return "Server error (" + response.status + ").";
    }
  }


  async function loadHistory() {
    setInboxStatus("Loading history...");

    const response = await protectedFetch("/history");

    if (!response) {
      return;
    }

    if (!response.ok) {
      setInboxStatus(await readError(response), true);
      return;
    }

    const data = await response.json();
    currentEmails = data.emails;

    const shown = applyFilter();
    setInboxStatus(
      "Showing " + shown + " of " + currentEmails.length + " saved emails"
    );
  }


  async function fetchNewEmails() {
    const btn = document.getElementById("fetch-emails-btn");
    btn.disabled = true;
    btn.textContent = "Fetching...";
    setInboxStatus("Fetching and classifying new emails from Gmail...");

    try {
      const response = await protectedFetch("/emails?n=10");

      if (!response) {
        return;
      }

      if (!response.ok) {
        setInboxStatus(await readError(response), true);
        return;
      }

      // /emails saves every email it classifies, so reloading history
      // shows the new ones together with everything saved before.
      const data = await response.json();
      await loadHistory();
      setInboxStatus(
        "Classified " + data.emails.length + " new emails. " +
        document.getElementById("inbox-status").textContent
      );

    } catch (e) {
      setInboxStatus("Could not reach the server.", true);

    } finally {
      btn.disabled = false;
      btn.textContent = "Fetch new emails";
    }
  }


  document
    .getElementById("load-history-btn")
    .addEventListener("click", loadHistory);

  document
    .getElementById("fetch-emails-btn")
    .addEventListener("click", fetchNewEmails);

  document
    .getElementById("label-filter")
    .addEventListener("change", () => {
      if (currentEmails.length === 0) {
        return;
      }

      const shown = applyFilter();
      setInboxStatus(
        "Showing " + shown + " of " + currentEmails.length + " saved emails"
      );
    });


  async function classify() {
    const subject = document.getElementById("subject").value.trim();
    const body = document.getElementById("body").value.trim();
    const btn = document.getElementById("btn");
    const errorEl = document.getElementById("error");
    const resultEl = document.getElementById("result");

    if (!body) {
      showError("Email body cannot be empty.");
      return;
    }

    errorEl.style.display = "none";
    resultEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Classifying...";

    try {
      const res = await api_fetch("/classify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subject, body })
      });

      if (!res.ok) {
        const e = await res.json();
        showError(e.detail || "Server error.");
        return;
      }

      const data = await res.json();
      renderResult(data);

    } catch (e) {
      showError(
        "Could not reach the server. Make sure uvicorn is running."
      );

    } finally {
      btn.disabled = false;
      btn.textContent = "Classify";
    }
  }


  function renderResult(data) {
    const badge = document.getElementById("label-badge");

    badge.textContent = data.label;
    badge.className = "badge badge-" + data.label;

    document.getElementById("confidence").textContent =
      (data.confidence * 100).toFixed(0) + "% confidence";

    document.getElementById("deadline").textContent =
      data.deadline || "None detected";

    const ul = document.getElementById("actions");

    ul.replaceChildren();

    if (data.actions.length) {
      for (const action of data.actions) {
        const li = document.createElement("li");
        li.textContent = action;
        ul.appendChild(li);
      }
    } else {
      const li = document.createElement("li");
      li.textContent = "None detected";
      li.style.color = "#71717a";
      ul.appendChild(li);
    }

    document.getElementById("result").style.display = "block";
  }


  function showError(msg) {
    const el = document.getElementById("error");

    el.textContent = msg;
    el.style.display = "block";
  }

</script>

</body>

</html>
